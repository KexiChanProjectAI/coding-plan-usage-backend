name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Verify dashboard.html exists
        run: test -f internal/web/dashboard.html

      - name: Check React 19.2 ESM markers
        run: |
          grep -q 'esm.sh/react@19.2.0' internal/web/dashboard.html
          grep -q 'esm.sh/react-dom@19.2.0/client' internal/web/dashboard.html

      - name: Reject UMD React paths
        run: |
          ! grep -q '/umd/' internal/web/dashboard.html

      - name: Run Go tests
        run: go test ./...

      - name: Build and verify embedded dashboard
        run: |
          go build -o ucpqa ./cmd/api
          strings ./ucpqa | grep -q 'QuotaHub Dashboard'
          strings ./ucpqa | grep -q 'esm.sh/react@19.2.0'

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          go build -ldflags="-X main.version=${VERSION}" -o ucpqa ./cmd/api
          archive_name="ucpqa-${VERSION}-${GOOS}-${GOARCH}.tar.gz"
          tar -czf "${archive_name}" ucpqa

      - uses: actions/upload-artifact@v4
        with:
          name: ucpqa-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ucpqa-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ucpqa-*
          merge-multiple: false

      - name: Generate checksums
        run: |
          cd artifacts
          find . -name "ucpqa-*.tar.gz" | while read -r archive; do
            sha256sum "$archive"
          done > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/ucpqa-*
            artifacts/**/checksums.txt
          generate_release_notes: true
