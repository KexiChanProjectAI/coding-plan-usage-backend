<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QuotaHub Dashboard</title>
  <style>
    :root {
      /* Background & Surface */
      --bg-primary: #08080e;
      --bg-secondary: #0e0e16;
      --surface-glass: rgba(255, 255, 255, 0.04);
      --surface-glass-hover: rgba(255, 255, 255, 0.08);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-hover: rgba(255, 255, 255, 0.14);

      /* Text */
      --text-primary: #f0f0f5;
      --text-secondary: rgba(240, 240, 245, 0.72);
      --text-muted: rgba(240, 240, 245, 0.42);

      /* Progress Bar Colors - 5H (Blue → Cyan) */
      --progress-5h-start: #3b82f6;
      --progress-5h-end: #06b6d4;
      --progress-5h-glow: rgba(6, 182, 212, 0.55);

      /* Progress Bar Colors - 7D (Green → Lime) */
      --progress-7d-start: #22c55e;
      --progress-7d-end: #a3e635;
      --progress-7d-glow: rgba(163, 230, 53, 0.55);

      /* Progress Bar Colors - 1M (Purple → Pink) */
      --progress-1m-start: #a855f7;
      --progress-1m-end: #ec4899;
      --progress-1m-glow: rgba(236, 72, 153, 0.55);

      /* Low Warning - Orange → Yellow */
      --progress-low-start: #f97316;
      --progress-low-end: #eab308;
      --progress-low-glow: rgba(234, 179, 8, 0.55);

      /* Critical - Red → Pink */
      --progress-critical-start: #ef4444;
      --progress-critical-end: #ec4899;
      --progress-critical-glow: rgba(236, 72, 153, 0.65);

      /* MD3 Spacing */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      /* Typography Scale */
      --text-caption: 11px;
      --text-body: 13px;
      --text-subtitle: 15px;
      --text-title: 18px;
      --text-headline: 22px;

      /* Letter Spacing */
      --ls-tight: -0.02em;
      --ls-normal: 0em;
      --ls-wide: 0.04em;

      /* Border Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;

      /* Shadows & Depth */
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.45);
      --shadow-glow-blue: 0 0 24px rgba(59, 130, 246, 0.15);
      --shadow-glow-purple: 0 0 24px rgba(168, 85, 247, 0.15);

      /* Safe Area */
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-primary);
      background-image:
        radial-gradient(ellipse 900px 600px at 10% 10%, rgba(59, 130, 246, 0.10) 0%, transparent 55%),
        radial-gradient(ellipse 800px 700px at 90% 90%, rgba(168, 85, 247, 0.10) 0%, transparent 55%),
        radial-gradient(ellipse 1200px 900px at 50% 50%, rgba(6, 182, 212, 0.07) 0%, transparent 60%),
        radial-gradient(ellipse 600px 400px at 70% 20%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
      color: var(--text-primary);
      height: 100vh;
      height: 100dvh;
      padding: var(--space-md);
      padding-left: calc(var(--space-md) + var(--safe-left));
      padding-bottom: calc(var(--space-md) + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-md);
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .header-title {
      font-size: var(--text-headline);
      font-weight: 700;
      letter-spacing: var(--ls-tight);
      line-height: 1.15;
      background: linear-gradient(135deg, var(--text-primary) 0%, rgba(240,240,245,0.75) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-subtitle {
      font-size: var(--text-body);
      color: var(--text-secondary);
      letter-spacing: var(--ls-normal);
      line-height: 1.4;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: var(--space-sm);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .refresh-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .refresh-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.10) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .refresh-btn:hover {
      background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
      transform: scale(1.08) translateY(-1px);
      box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.06);
      border-color: var(--border-glass-hover);
    }

    .refresh-btn:hover::before {
      opacity: 1;
    }

    .refresh-btn:active {
      transform: scale(0.96) translateY(0);
      transition-duration: 0.1s;
    }

    .refresh-btn svg {
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .refresh-btn.spinning svg {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .last-updated {
      font-size: var(--text-caption);
      color: var(--text-muted);
      letter-spacing: var(--ls-wide);
      text-transform: uppercase;
    }

    .time-badge {
      font-size: var(--text-caption);
      color: var(--text-secondary);
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-glass);
      font-variant-numeric: tabular-nums;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
      letter-spacing: var(--ls-wide);
    }

    /* Plan Cards Container */
    .plans-container {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    /* Plan Card */
    .plan-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: var(--space-sm) var(--space-md);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.04);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .plan-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
      opacity: 0.6;
    }

    .plan-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(600px 400px at 80% 0%, rgba(59,130,246,0.04) 0%, transparent 60%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .plan-card:hover {
      background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.06);
      border-color: var(--border-glass-hover);
    }

    .plan-card:hover::after {
      opacity: 1;
    }

    .plan-header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-xs);
      flex-shrink: 0;
    }

    .plan-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
      letter-spacing: var(--ls-wide);
      position: relative;
      overflow: hidden;
    }

    .plan-avatar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 60%);
      border-radius: inherit;
      pointer-events: none;
    }

    .plan-info {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--space-sm);
      min-width: 0;
      flex: 1;
    }

    .plan-name {
      font-size: var(--text-subtitle);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
      letter-spacing: var(--ls-tight);
      line-height: 1.2;
    }

    .plan-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px var(--space-xs);
      border-radius: var(--radius-sm);
      font-size: 10px;
      font-weight: 600;
      width: fit-content;
      flex-shrink: 0;
      letter-spacing: var(--ls-wide);
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }

    .plan-meta {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--space-sm);
      margin-left: auto;
      flex-shrink: 0;
    }

    .plan-meta-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .plan-meta-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: var(--ls-wide);
      font-weight: 600;
    }

    .plan-meta-value {
      font-size: var(--text-caption);
      font-weight: 700;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .plan-badge.healthy {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.08), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .plan-badge.warning {
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
      border: 1px solid rgba(234, 179, 8, 0.25);
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.08), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .plan-badge.critical {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.08), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* Quota Grid */
    .quota-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-sm);
      flex: 1;
      min-height: 0;
    }

    .quota-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: var(--space-sm);
      background: linear-gradient(145deg, rgba(0,0,0,0.28), rgba(0,0,0,0.18));
      border-radius: var(--radius-md);
      min-width: 0;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 2px 6px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .quota-block::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
      opacity: 0.5;
    }

    .quota-block.empty {
      opacity: 0.3;
      justify-content: center;
      align-items: center;
    }

    .quota-block:hover {
      background: linear-gradient(145deg, rgba(0,0,0,0.35), rgba(0,0,0,0.22));
      transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 6px 16px rgba(0,0,0,0.25);
      border-color: rgba(255,255,255,0.08);
    }

    .quota-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: var(--ls-wide);
      text-transform: uppercase;
    }

    .quota-remaining {
      font-size: var(--text-body);
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: var(--ls-tight);
      line-height: 1.3;
    }

    .quota-percentage {
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: var(--ls-wide);
    }

    .progress-container {
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-top: auto;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.25);
    }

    .progress-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1), filter 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .progress-bar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(180deg, rgba(255,255,255,0.28), transparent);
      border-radius: 4px 4px 0 0;
      z-index: 2;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.40), transparent);
      animation: shimmer 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      z-index: 1;
    }

    @keyframes shimmer {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(130%); }
    }

    .progress-bar.glow {
      filter: drop-shadow(0 0 10px var(--glow-color, rgba(255, 255, 255, 0.45)))
              drop-shadow(0 0 20px var(--glow-color, rgba(255, 255, 255, 0.25)));
      animation: pulse-glow 2.2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% {
        filter: drop-shadow(0 0 6px var(--glow-color, rgba(255,255,255,0.35)))
                drop-shadow(0 0 14px var(--glow-color, rgba(255,255,255,0.18)));
      }
      50% {
        filter: drop-shadow(0 0 12px var(--glow-color, rgba(255,255,255,0.55)))
                drop-shadow(0 0 28px var(--glow-color, rgba(255,255,255,0.30)));
      }
    }

    /* Progress Bar Color Classes */
    .progress-5h {
      background: linear-gradient(90deg, var(--progress-5h-start), var(--progress-5h-end));
      --glow-color: var(--progress-5h-glow);
    }

    .progress-7d {
      background: linear-gradient(90deg, var(--progress-7d-start), var(--progress-7d-end));
      --glow-color: var(--progress-7d-glow);
    }

    .progress-1m {
      background: linear-gradient(90deg, var(--progress-1m-start), var(--progress-1m-end));
      --glow-color: var(--progress-1m-glow);
    }

    .progress-low {
      background: linear-gradient(90deg, var(--progress-low-start), var(--progress-low-end));
      --glow-color: var(--progress-low-glow);
    }

    .progress-critical {
      background: linear-gradient(90deg, var(--progress-critical-start), var(--progress-critical-end));
      --glow-color: var(--progress-critical-glow);
    }

    /* Legend */
    .legend {
      display: flex;
      justify-content: center;
      gap: var(--space-md);
      padding: var(--space-sm) var(--space-md);
      background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      flex-wrap: wrap;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--text-caption);
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: var(--ls-wide);
      text-transform: uppercase;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 8px currentColor;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
      flex-shrink: 0;
    }

    .legend-item:hover .legend-dot {
      transform: scale(1.35);
      box-shadow: 0 0 14px currentColor;
    }

    .legend-dot.high {
      background: linear-gradient(135deg, #22c55e, #4ade80);
      color: rgba(74, 222, 128, 0.6);
    }

    .legend-dot.medium {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: rgba(6, 182, 212, 0.6);
    }

    .legend-dot.low {
      background: linear-gradient(135deg, #f97316, #eab308);
      color: rgba(234, 179, 8, 0.6);
    }

    .legend-dot.critical {
      background: linear-gradient(135deg, #ef4444, #ec4899);
      color: rgba(236, 72, 153, 0.6);
    }

    /* Loading Skeleton */
    .skeleton {
      background: linear-gradient(90deg,
        rgba(255,255,255,0.03) 0%,
        rgba(255, 255, 255, 0.09) 35%,
        rgba(255, 255, 255, 0.16) 50%,
        rgba(255, 255, 255, 0.09) 65%,
        rgba(255,255,255,0.03) 100%);
      background-size: 350% 100%;
      animation: skeleton-loading 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      border-radius: var(--radius-md);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.18) 100%);
      border-radius: inherit;
      pointer-events: none;
    }

    @keyframes skeleton-loading {
      0% { background-position: 175% 0; }
      100% { background-position: -175% 0; }
    }

    .skeleton-card {
      height: 180px;
    }

    .skeleton-header {
      display: flex;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }

    .skeleton-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
    }

    .skeleton-text {
      flex: 1;
    }

    .skeleton-text-row {
      height: 16px;
      margin-bottom: var(--space-sm);
    }

    .skeleton-text-row:last-child {
      width: 60%;
      margin-bottom: 0;
    }

    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-md);
    }

    .skeleton-quota {
      height: 100px;
      border-radius: var(--radius-lg);
    }

    /* Error Banner */
    .error-banner {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.10), rgba(236, 72, 153, 0.06));
      border: 1px solid rgba(239, 68, 68, 0.30);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-md);
      color: #fca5a5;
      box-shadow: var(--shadow-md), 0 4px 20px rgba(239, 68, 68, 0.12), inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      animation: error-slide-in 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .error-banner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(252, 165, 165, 0.55), transparent);
    }

    .error-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(500px 300px at 20% 0%, rgba(239,68,68,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    @keyframes error-slide-in {
      from {
        opacity: 0;
        transform: translateY(-14px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .error-banner svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.45));
      position: relative;
      z-index: 1;
    }

    .error-banner-content {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .error-banner-title {
      font-weight: 700;
      margin-bottom: var(--space-xs);
      letter-spacing: var(--ls-tight);
      font-size: var(--text-subtitle);
    }

    .error-banner-message {
      font-size: var(--text-caption);
      opacity: 0.85;
      line-height: 1.45;
      letter-spacing: var(--ls-normal);
    }

    .retry-btn {
      padding: var(--space-sm) var(--space-md);
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.22), rgba(236, 72, 153, 0.12));
      border: 1px solid rgba(239, 68, 68, 0.40);
      border-radius: var(--radius-sm);
      color: #fca5a5;
      cursor: pointer;
      font-size: var(--text-caption);
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.12);
      position: relative;
      overflow: hidden;
      letter-spacing: var(--ls-wide);
      text-transform: uppercase;
      z-index: 1;
    }

    .retry-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent);
      pointer-events: none;
    }

    .retry-btn:hover {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.32), rgba(236, 72, 153, 0.22));
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(239, 68, 68, 0.22);
      border-color: rgba(239, 68, 68, 0.55);
    }

    .retry-btn:active {
      transform: translateY(0) scale(0.97);
      box-shadow: 0 1px 6px rgba(239, 68, 68, 0.18);
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: var(--space-sm);
        padding-left: calc(var(--space-sm) + var(--safe-left));
      }

      .header {
        flex-direction: column;
        gap: var(--space-sm);
      }

      .header-right {
        align-items: flex-start;
        flex-direction: row;
        flex-wrap: wrap;
      }

      .quota-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-xs);
      }

      .plan-card {
        padding: var(--space-xs) var(--space-sm);
      }

      .legend {
        gap: var(--space-sm);
        padding: var(--space-xs) var(--space-sm);
      }

      .plans-container {
        gap: var(--space-xs);
      }
    }

    @media (min-width: 800px) {
      .quota-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Desktop adjustments for ultra-wide feel */
    @media (min-width: 1200px) {
      body {
        max-width: 1400px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <h1 class="header-title">Coding Plans</h1>
      <p class="header-subtitle">Overview of your coding plan usage</p>
    </div>
    <div class="header-right">
      <div class="header-actions">
        <button class="refresh-btn" id="refreshBtn" aria-label="Refresh data">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
        <div class="time-badge" id="timeBadge">--:--:--</div>
      </div>
      <span class="last-updated" id="lastUpdated">Last updated: --</span>
    </div>
  </header>

  <main class="plans-container" id="plansContainer">
    
  </main>

  <footer class="legend">
    <div class="legend-item">
      <span class="legend-dot high"></span>
      <span>High 70–100%</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot medium"></span>
      <span>Medium 30–70%</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot low"></span>
      <span>Low 10–30%</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot critical"></span>
      <span>Critical 0–10%</span>
    </div>
  </footer>

  <script>
    const API_URL = '/api/v1/usage';
    const REFRESH_INTERVAL = 1000;

    const quotaTypeMap = {
      '5H': '5H',
      '1W': '7D',
      '1M': '1M'
    };

    const quotaOrder = ['5H', '7D', '1M'];

    let lastFetchTime = null;
    let refreshTimer = null;

    // DOM Elements
    const plansContainer = document.getElementById('plansContainer');
    const refreshBtn = document.getElementById('refreshBtn');
    const lastUpdatedEl = document.getElementById('lastUpdated');
    const timeBadge = document.getElementById('timeBadge');

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      updateTime();
      setInterval(updateTime, 1000);
      fetchData();
      startAutoRefresh();
      requestFullscreen();
      requestWakeLock();
    });

    async function requestFullscreen() {
      const el = document.documentElement;
      try {
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) await el.msRequestFullscreen();
      } catch (e) {
        console.warn('Fullscreen request failed:', e);
      }
    }

    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            console.log('Wake Lock released');
          });
          document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && !wakeLock) {
              wakeLock = await navigator.wakeLock.request('screen');
            }
          });
        }
      } catch (e) {
        console.warn('Wake Lock request failed:', e);
      }
    }

    refreshBtn.addEventListener('click', () => {
      fetchData(true);
    });

    function updateTime() {
      const now = new Date();
      timeBadge.textContent = now.toLocaleTimeString('en-US', {
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => fetchData(), REFRESH_INTERVAL);
    }

    function getTimeAgo(date) {
      if (!date) return '--';
      const seconds = Math.floor((new Date() - date) / 1000);
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      return `${hours}h ago`;
    }

    function formatDuration(used, total, resetAt) {
      const percentage = Math.round(((total - used) / total) * 100);
      const clampedPercentage = Math.max(0, Math.min(100, percentage));
      // Invalid reset date means no reset (INF)
      if (!resetAt || resetAt === '0001-01-01T00:00:00Z') {
        return `INF · ${clampedPercentage}%`;
      }
      const resetDate = new Date(resetAt);
      const now = new Date();
      const diffMs = resetDate - now;
      if (diffMs > 0) {
        const diffMins = Math.ceil(diffMs / 60000);
        const h = Math.floor(diffMins / 60);
        const m = diffMins % 60;
        if (h > 0) return `${h}h ${m}m · ${clampedPercentage}%`;
        return `${m}m · ${clampedPercentage}%`;
      }
      return `${clampedPercentage}% left`;
    }

    function getProgressClass(percentage, quotaType) {
      if (percentage <= 10) return 'critical';
      if (percentage <= 30) return 'low';
      return `progress-${quotaType.toLowerCase().replace('7d', '7d')}`;
    }

    function getProgressColorClass(percentage, quotaType) {
      if (percentage <= 10) return 'progress-critical';
      if (percentage <= 30) return 'progress-low';
      return `progress-${quotaType.toLowerCase().replace('7d', '7d')}`;
    }

    function getAvatarColor(platform) {
      const colors = [
        '#3b82f6', '#8b5cf6', '#ec4899', '#f97316',
        '#22c55e', '#06b6d4', '#eab308', '#ef4444'
      ];
      let hash = 0;
      for (let i = 0; i < platform.length; i++) {
        hash = platform.charCodeAt(i) + ((hash << 5) - hash);
      }
      return colors[Math.abs(hash) % colors.length];
    }

    function getStatusClass(status) {
      if (!status) return 'healthy';
      const s = status.toLowerCase();
      if (s === 'healthy' || s === 'active') return 'healthy';
      if (s === 'warning' || s === 'limited') return 'warning';
      return 'critical';
    }

    function formatStatusLabel(status) {
      if (!status) return 'Unknown';
      return status.charAt(0).toUpperCase() + status.slice(1) + ' Plan';
    }

    function renderLoadingSkeletons() {
      plansContainer.innerHTML = `
        <div class="skeleton-card skeleton" style="height: 200px;"></div>
        <div class="skeleton-card skeleton" style="height: 200px;"></div>
        <div class="skeleton-card skeleton" style="height: 200px;"></div>
      `;
    }

    function renderError(message, isManual = false) {
      const errorHTML = `
        <div class="error-banner">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          <div class="error-banner-content">
            <div class="error-banner-title">Failed to load data</div>
            <div class="error-banner-message">${message}</div>
          </div>
          ${isManual ? '' : `<button class="retry-btn" onclick="fetchData()">Retry</button>`}
        </div>
        ${renderSampleCards()}
      `;
      plansContainer.innerHTML = errorHTML;
    }

    function renderSampleCards() {
      return `
        <div class="plan-card">
          <div class="plan-header">
            <div class="plan-avatar" style="background: linear-gradient(135deg, #3b82f6, #8b5cf6);">S</div>
            <div class="plan-info">
              <div class="plan-name">Sample Plan</div>
              <span class="plan-badge healthy">Pro Plan</span>
            </div>
          </div>
          <div class="quota-grid">
            <div class="quota-block">
              <span class="quota-label">5H</span>
              <span class="quota-remaining">-- remaining</span>
              <span class="quota-percentage">--%</span>
              <div class="progress-container">
                <div class="progress-bar progress-5h" style="width: 0%;"></div>
              </div>
            </div>
            <div class="quota-block">
              <span class="quota-label">7D</span>
              <span class="quota-remaining">-- remaining</span>
              <span class="quota-percentage">--%</span>
              <div class="progress-container">
                <div class="progress-bar progress-7d" style="width: 0%;"></div>
              </div>
            </div>
            <div class="quota-block empty">
              <span class="quota-label">1M</span>
              <span class="quota-remaining">—</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderPlans(data) {
      if (!Array.isArray(data) || data.length === 0) {
        plansContainer.innerHTML = `
          <div class="error-banner">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div class="error-banner-content">
              <div class="error-banner-title">No data available</div>
              <div class="error-banner-message">No usage data found. Check back later.</div>
            </div>
          </div>
        `;
        return;
      }

      const sortedData = [...data].sort((a, b) => {
        const nameA = (a.platform || '').toLowerCase();
        const nameB = (b.platform || '').toLowerCase();
        return nameA.localeCompare(nameB);
      });

      // Build new DOM off-screen to avoid jitter
      const fragment = document.createDocumentFragment();
      const wrapper = document.createElement('div');
      wrapper.style.display = 'contents';
      wrapper.innerHTML = sortedData.map(plan => {
        const platformName = plan.platform || 'Unknown';
        const avatarColor = getAvatarColor(platformName);
        const status = plan.status || 'healthy';
        const statusClass = getStatusClass(status);
        const statusLabel = formatStatusLabel(status);

        const quotas = plan.quotas || {};

        const quotaBlocks = quotaOrder.map(type => {
          const displayType = type;
          const apiType = type === '7D' ? '1W' : type;
          const quota = quotas[apiType];

          if (!quota) {
            return `
              <div class="quota-block empty">
                <span class="quota-label">${displayType}</span>
                <span class="quota-remaining">—</span>
              </div>
            `;
          }

          const used = quota.used || 0;
          const total = quota.total || 1;
          const percentage = Math.round(((total - used) / total) * 100);
          const clampedPercentage = Math.max(0, Math.min(100, percentage));
          const resetAt = quota.reset_at;
          const remainingText = formatDuration(used, total, resetAt);
          const colorClass = getProgressColorClass(clampedPercentage, displayType);
          const isLow = clampedPercentage <= 30;

          return `
            <div class="quota-block">
              <span class="quota-label">${displayType}</span>
              <span class="quota-remaining">${remainingText}</span>
              <span class="quota-percentage">${clampedPercentage}%</span>
              <div class="progress-container">
                <div class="progress-bar ${colorClass} ${isLow ? 'glow' : ''}" style="width: ${clampedPercentage}%;"></div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <article class="plan-card">
            <div class="plan-header">
              <div class="plan-avatar" style="background: linear-gradient(135deg, ${avatarColor}, ${avatarColor}dd);">
                ${platformName.charAt(0)}
              </div>
              <div class="plan-info">
                <h2 class="plan-name">${platformName}</h2>
                <span class="plan-badge ${statusClass}">${statusLabel}</span>
              </div>
              <div class="plan-meta">
                <div class="plan-meta-item">
                  <span class="plan-meta-label">5H</span>
                  <span class="plan-meta-value">${(quotas['5H'] ? Math.max(0, Math.min(100, Math.round(((quotas['5H'].total - quotas['5H'].used) / quotas['5H'].total) * 100))) : '—')}%</span>
                </div>
                <div class="plan-meta-item">
                  <span class="plan-meta-label">7D</span>
                  <span class="plan-meta-value">${(quotas['1W'] ? Math.max(0, Math.min(100, Math.round(((quotas['1W'].total - quotas['1W'].used) / quotas['1W'].total) * 100))) : '—')}%</span>
                </div>
                <div class="plan-meta-item">
                  <span class="plan-meta-label">1M</span>
                  <span class="plan-meta-value">${(quotas['1M'] ? Math.max(0, Math.min(100, Math.round(((quotas['1M'].total - quotas['1M'].used) / quotas['1M'].total) * 100))) : '—')}%</span>
                </div>
              </div>
            </div>
            <div class="quota-grid">
              ${quotaBlocks}
            </div>
          </article>
        `;
      }).join('');
      fragment.appendChild(wrapper);
      plansContainer.innerHTML = '';
      plansContainer.appendChild(fragment);
    }

    async function fetchData(isManual = false) {
      if (isManual) {
        refreshBtn.classList.add('spinning');
      }

      try {
        const response = await fetch(API_URL, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          },
          signal: AbortSignal.timeout(10000)
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        lastFetchTime = new Date();
        lastUpdatedEl.textContent = `Last updated: ${getTimeAgo(lastFetchTime)}`;

        renderPlans(data);
      } catch (error) {
        console.error('Fetch error:', error);
        const message = error.name === 'AbortError'
          ? 'Request timed out. Check your connection.'
          : error.message || 'Unable to connect to server';
        renderError(message, isManual);
      } finally {
        refreshBtn.classList.remove('spinning');
      }
    }

    // Update "last updated" text periodically
    setInterval(() => {
      if (lastFetchTime) {
        lastUpdatedEl.textContent = `Last updated: ${getTimeAgo(lastFetchTime)}`;
      }
    }, 10000);
  </script>
</body>
</html>
