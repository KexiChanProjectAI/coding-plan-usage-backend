# QuotaHub Configuration
# See README.md for full documentation

server:
  api_port: 8080        # API server port (REST, SSE, WebSocket)
  metrics_port: 9090    # Prometheus metrics server port
  # CORS configuration for cross-origin frontend access
  # cors_enabled: true                                          # Enable CORS (disabled by default)
  # cors_allowed_origins:                                       # Allowed origins (configure explicitly)
  #   - "http://localhost:5173"                                 # Local Vite dev server
  #   - "https://your-pages-domain.pages.dev"                   # Cloudflare Pages deployment
  # cors_allowed_methods:                                       # HTTP methods allowed (defaults to GET, OPTIONS)
  #   - "GET"
  #   - "OPTIONS"
  # cors_allowed_headers:                                       # Allowed request headers
  #   - "Content-Type"

global:
  max_stale_duration: 10m  # Quota tiers with reset_at older than this are omitted from snapshots

providers:
  # Kimi Coding Plan
  kimi:
    type: kimi
    name: kimi
    base_url: "https://api.kimi.com/"
    token: "your-kimi-token-here"      # REQUIRED
    refresh_interval: 5m
    jitter_percent: 10
    backoff_initial: 2s
    backoff_max: 120s

  # MiniMax — work account
  minimax-work:
    type: minimax
    name: minimax-work
    base_url: "https://www.minimaxi.com/"
    token: "your-minimax-work-token-here"   # REQUIRED
    refresh_interval: 5m
    jitter_percent: 10
    backoff_initial: 1s
    backoff_max: 60s

  # MiniMax — personal account (second instance of same type!)
  minimax-personal:
    type: minimax
    name: minimax-personal
    base_url: "https://www.minimaxi.com/"
    token: "your-minimax-personal-token-here"   # REQUIRED
    refresh_interval: 5m
    jitter_percent: 10
    backoff_initial: 1s
    backoff_max: 60s

  # CPA — CLIProxyAPI Codex Pool Aggregator
  # Queries OpenAI Codex accounts through a CLIProxyAPI management instance and
  # reports the equal-weighted average remaining percentage of successful queries.
  cpa:
    type: cpa
    name: cpa
    base_url: "http://127.0.0.1:8317/v0/management"  # CLIProxyAPI management base URL
    token: "your-cliproxyapi-management-key-here"      # REQUIRED
    refresh_interval: 5m
    jitter_percent: 10
    backoff_initial: 2s
    backoff_max: 120s
    stagger: 1s                                        # Delay between per-account requests

  # Z.ai — MonitorQuota API
  zai:
    type: zai
    name: zai
    base_url: "https://console.z.ai/"
    token: "your-zai-token-here"       # REQUIRED
    refresh_interval: 5m
    jitter_percent: 10
    backoff_initial: 2s
    backoff_max: 120s

  # Zhipu BigModel — MonitorQuota API (same shape as Z.ai)
  zhipu:
    type: zhipu
    name: zhipu
    base_url: "https://open.bigmodel.cn/"
    token: "your-zhipu-token-here"     # REQUIRED
    refresh_interval: 5m
    jitter_percent: 10
    backoff_initial: 2s
    backoff_max: 120s
