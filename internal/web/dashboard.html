<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1c1b1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QuotaHub Dashboard</title>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.0",
        "react-dom/client": "https://esm.sh/react-dom@19.2.0/client"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* MD3 Dark Theme - Tonal Palette */
      --md-sys-color-primary: #d0bcff;
      --md-sys-color-on-primary: #381e72;
      --md-sys-color-primary-container: #4f378b;
      --md-sys-color-on-primary-container: #eaddff;
      --md-sys-color-secondary: #ccc2dc;
      --md-sys-color-on-secondary: #332d41;
      --md-sys-color-secondary-container: #4a4458;
      --md-sys-color-on-secondary-container: #e8def8;
      --md-sys-color-tertiary: #efb8c8;
      --md-sys-color-on-tertiary: #492532;
      --md-sys-color-tertiary-container: #633b48;
      --md-sys-color-on-tertiary-container: #ffd8e4;
      --md-sys-color-error: #f2b8b5;
      --md-sys-color-on-error: #601410;
      --md-sys-color-error-container: #8c1d18;
      --md-sys-color-on-error-container: #f9dedc;
      --md-sys-color-surface: #1c1b1f;
      --md-sys-color-surface-dim: #141218;
      --md-sys-color-surface-bright: #3b383e;
      --md-sys-color-surface-container-lowest: #0f0d13;
      --md-sys-color-surface-container-low: #1c1b1f;
      --md-sys-color-surface-container: #211f26;
      --md-sys-color-surface-container-high: #2b2930;
      --md-sys-color-surface-container-highest: #36343b;
      --md-sys-color-on-surface: #e6e1e5;
      --md-sys-color-on-surface-variant: #cac4d0;
      --md-sys-color-outline: #938f99;
      --md-sys-color-outline-variant: #49454f;

      /* MD3 Elevation (surface tint at 5% opacity layers) */
      --md-elevation-1: 0px 1px 3px 1px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.3);
      --md-elevation-2: 0px 2px 6px 2px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.3);
      --md-elevation-3: 0px 4px 8px 3px rgba(0,0,0,0.15), 0px 1px 3px 0px rgba(0,0,0,0.3);

      /* MD3 Shape */
      --md-shape-xs: 4px;
      --md-shape-sm: 8px;
      --md-shape-md: 12px;
      --md-shape-lg: 16px;
      --md-shape-xl: 28px;

      /* MD3 Typography Scale */
      --md-text-display: 2.25rem;
      --md-text-headline: 1.75rem;
      --md-text-title-lg: 1.375rem;
      --md-text-title-md: 1rem;
      --md-text-title-sm: 0.875rem;
      --md-text-body-lg: 1rem;
      --md-text-body-md: 0.875rem;
      --md-text-body-sm: 0.75rem;
      --md-text-label-lg: 0.875rem;
      --md-text-label-md: 0.75rem;
      --md-text-label-sm: 0.6875rem;

      /* Spacing */
      --md-space-xs: 4px;
      --md-space-sm: 8px;
      --md-space-md: 12px;
      --md-space-lg: 16px;
      --md-space-xl: 24px;
      --md-space-2xl: 32px;

      /* Progress colors (MD3 tonal) */
      --progress-5h: #81d4fa;
      --progress-5h-container: #0d3c4f;
      --progress-1w: #a5d6a7;
      --progress-1w-container: #1b3e1f;
      --progress-1m: #ce93d8;
      --progress-1m-container: #3e1e4a;
      --progress-low: #ffcc80;
      --progress-low-container: #4a2e0a;
      --progress-critical: #ef9a9a;
      --progress-critical-container: #4a1a1a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--md-sys-color-surface-dim);
      color: var(--md-sys-color-on-surface);
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline-variant); border-radius: 3px; }

    /* Layout */
    .app-root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(28, 27, 31, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      padding: var(--md-space-md) var(--md-space-xl);
    }

    .app-header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--md-space-md);
    }

    .app-header-title {
      font-size: var(--md-text-title-lg);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--md-sys-color-on-surface);
    }

    .app-header-meta {
      display: flex;
      align-items: center;
      gap: var(--md-space-md);
    }

    .last-updated {
      font-size: var(--md-text-label-md);
      color: var(--md-sys-color-on-surface-variant);
    }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .refresh-btn:hover { background: var(--md-sys-color-surface-container-highest); }
    .refresh-btn:active { transform: scale(0.95); }
    .refresh-btn.spinning svg { animation: spin 1s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .app-main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: var(--md-space-xl);
    }

    /* State banners */
    .state-banner {
      border-radius: var(--md-shape-md);
      padding: var(--md-space-lg);
      margin-bottom: var(--md-space-xl);
      display: flex;
      align-items: center;
      gap: var(--md-space-md);
    }

    .state-banner.error {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }

    .state-banner.empty {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: var(--md-space-2xl);
    }

    .state-banner-title {
      font-size: var(--md-text-title-sm);
      font-weight: 600;
    }

    .state-banner-msg {
      font-size: var(--md-text-body-sm);
      opacity: 0.9;
    }

    .retry-btn {
      margin-left: auto;
      padding: var(--md-space-sm) var(--md-space-lg);
      border-radius: var(--md-shape-sm);
      border: 1px solid var(--md-sys-color-outline);
      background: transparent;
      color: inherit;
      font-size: var(--md-text-label-lg);
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .retry-btn:hover { background: rgba(255,255,255,0.06); }

    /* Provider Card */
    .provider-card {
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-shape-lg);
      border: 1px solid var(--md-sys-color-outline-variant);
      margin-bottom: var(--md-space-lg);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .provider-card:hover {
      box-shadow: var(--md-elevation-2);
      border-color: var(--md-sys-color-outline);
    }

    .provider-header {
      display: flex;
      align-items: center;
      gap: var(--md-space-md);
      padding: var(--md-space-lg);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }

    .provider-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--md-text-title-sm);
      font-weight: 600;
      flex-shrink: 0;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .provider-info {
      flex: 1;
      min-width: 0;
    }

    .provider-name {
      font-size: var(--md-text-title-sm);
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .provider-alias {
      font-size: var(--md-text-label-md);
      color: var(--md-sys-color-on-surface-variant);
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--md-shape-sm);
      font-size: var(--md-text-label-md);
      font-weight: 500;
      flex-shrink: 0;
    }

    .status-chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-chip.healthy { background: var(--progress-1w-container); color: var(--progress-1w); }
    .status-chip.healthy .dot { background: var(--progress-1w); }
    .status-chip.warning { background: var(--progress-low-container); color: var(--progress-low); }
    .status-chip.warning .dot { background: var(--progress-low); }
    .status-chip.critical { background: var(--progress-critical-container); color: var(--progress-critical); }
    .status-chip.critical .dot { background: var(--progress-critical); }
    .status-chip.unknown { background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface-variant); }
    .status-chip.unknown .dot { background: var(--md-sys-color-outline); }

    /* Quotas Grid */
    .quotas-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--md-space-md);
      padding: var(--md-space-lg);
    }

    .quota-item {
      background: var(--md-sys-color-surface-container-low);
      border-radius: var(--md-shape-md);
      padding: var(--md-space-md);
      border: 1px solid var(--md-sys-color-outline-variant);
      transition: background 0.2s;
    }

    .quota-item:hover { background: var(--md-sys-color-surface-container-high); }

    .quota-item.empty {
      opacity: 0.5;
    }

    .quota-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--md-space-sm);
    }

    .quota-label {
      font-size: var(--md-text-label-sm);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--md-sys-color-on-surface-variant);
    }

    .quota-pct {
      font-size: var(--md-text-label-sm);
      font-weight: 600;
    }

    .quota-pct.critical { color: var(--progress-critical); }
    .quota-pct.warning { color: var(--progress-low); }
    .quota-pct.ok { color: var(--md-sys-color-on-surface-variant); }

    .progress-track {
      height: 8px;
      border-radius: var(--md-shape-xs);
      background: var(--md-sys-color-surface-container-highest);
      overflow: hidden;
      margin-bottom: var(--md-space-sm);
    }

    .progress-fill {
      height: 100%;
      border-radius: var(--md-shape-xs);
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-fill.q5h { background: var(--progress-5h); }
    .progress-fill.q1w { background: var(--progress-1w); }
    .progress-fill.q1m { background: var(--progress-1m); }
    .progress-fill.critical { background: var(--progress-critical); }
    .progress-fill.warning { background: var(--progress-low); }

    .quota-nums {
      display: flex;
      justify-content: space-between;
      font-size: var(--md-text-label-sm);
      color: var(--md-sys-color-on-surface-variant);
    }

    .quota-meta {
      margin-top: var(--md-space-sm);
      padding-top: var(--md-space-sm);
      border-top: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      justify-content: space-between;
      font-size: var(--md-text-label-sm);
      color: var(--md-sys-color-on-surface-variant);
    }

    /* Footer row inside card */
    .provider-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--md-space-md) var(--md-space-lg);
      background: var(--md-sys-color-surface-container-low);
      border-top: 1px solid var(--md-sys-color-outline-variant);
      font-size: var(--md-text-label-sm);
      color: var(--md-sys-color-on-surface-variant);
      gap: var(--md-space-md);
      flex-wrap: wrap;
    }

    .provider-footer span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--md-sys-color-surface-container-high) 25%, var(--md-sys-color-surface-container-highest) 50%, var(--md-sys-color-surface-container-high) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s infinite;
      border-radius: var(--md-shape-sm);
    }

    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-card {
      height: 180px;
      border-radius: var(--md-shape-lg);
      margin-bottom: var(--md-space-lg);
    }

    /* Responsive */
    @media (max-width: 720px) {
      .app-header { padding: var(--md-space-md); }
      .app-main { padding: var(--md-space-md); }
      .quotas-grid { grid-template-columns: 1fr; gap: var(--md-space-sm); padding: var(--md-space-md); }
      .provider-header { padding: var(--md-space-md); }
      .provider-footer { padding: var(--md-space-md); flex-direction: column; align-items: flex-start; gap: var(--md-space-xs); }
    }

    @media (min-width: 721px) and (max-width: 1024px) {
      .quotas-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useCallback, useRef } from 'react';
    import { createRoot } from 'react-dom/client';

    /* ---------- Utilities ---------- */
    const API_URL = (() => {
      const origin = typeof location !== 'undefined' ? location.origin : '';
      if (origin.includes('100.64.1.38:8070')) return '/api/v1/usage';
      return 'http://100.64.1.38:8070/api/v1/usage';
    })();

    function hashString(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h << 5) - h + str.charCodeAt(i);
      return Math.abs(h);
    }

    function avatarColor(name) {
      const palette = [
        ['#4f378b', '#eaddff'],
        ['#0d4f4f', '#a7f3d0'],
        ['#4a1a3a', '#fbcfe8'],
        ['#4a2e0a', '#fde68a'],
        ['#1a2e4a', '#bfdbfe'],
        ['#1a3a1a', '#bbf7d0'],
      ];
      return palette[hashString(name || '') % palette.length];
    }

    function getStatusChip(status) {
      const s = (status || '').toLowerCase();
      if (s === 'healthy' || s === 'active') return 'healthy';
      if (s === 'warning' || s === 'limited') return 'warning';
      if (s === 'critical' || s === 'error' || s === 'down') return 'critical';
      return 'unknown';
    }

    function formatStatusLabel(status) {
      const s = (status || '').toLowerCase();
      if (s === 'healthy' || s === 'active') return 'Healthy';
      if (s === 'warning' || s === 'limited') return 'Warning';
      if (s === 'critical' || s === 'error' || s === 'down') return 'Critical';
      return 'Unknown';
    }

    function fmtDate(iso) {
      if (!iso || iso.startsWith('0001-01-01')) return '—';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '—';
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function timeAgo(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '—';
      const diff = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diff < 60) return 'just now';
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    }

    function pct(used, total) {
      if (!total || total <= 0) return 0;
      const p = (used / total) * 100;
      return Math.min(100, Math.max(0, p));
    }

    function pctClass(p) {
      if (p >= 90) return 'critical';
      if (p >= 70) return 'warning';
      return 'ok';
    }

    /* ---------- Components ---------- */

    function IconRefresh({ size = 20 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="23 4 23 10 17 10" />
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
        </svg>
      );
    }

    function IconAlert({ size = 24 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      );
    }

    function IconInbox({ size = 40 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.6">
          <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
          <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
        </svg>
      );
    }

    function QuotaBlock({ label, data }) {
      if (!data || !data.total) {
        return (
          <div className="quota-item empty" aria-label={`${label} quota unavailable`}>
            <div className="quota-header">
              <span className="quota-label">{label}</span>
              <span className="quota-pct ok">—</span>
            </div>
            <div className="progress-track"><div className="progress-fill" style={{ width: '0%' }} /></div>
            <div className="quota-nums"><span>—</span><span>—</span></div>
            <div className="quota-meta"><span>Reset —</span></div>
          </div>
        );
      }
      const p = pct(data.used, data.total);
      const cls = pctClass(p);
      const fillCls = cls === 'ok' ? (label === '5H' ? 'q5h' : label === '1W' ? 'q1w' : 'q1m') : cls;
      return (
        <div className="quota-item" aria-label={`${label} quota ${Math.round(p)} percent used`}>
          <div className="quota-header">
            <span className="quota-label">{label}</span>
            <span className={`quota-pct ${cls}`}>{Math.round(p)}%</span>
          </div>
          <div className="progress-track">
            <div className={`progress-fill ${fillCls}`} style={{ width: `${p}%` }} />
          </div>
          <div className="quota-nums">
            <span>{data.used} used</span>
            <span>{data.total} total</span>
          </div>
          <div className="quota-meta">
            <span>Reset {fmtDate(data.reset_at)}</span>
          </div>
        </div>
      );
    }

    function ProviderCard({ provider }) {
      const [bg, fg] = avatarColor(provider.platform);
      const chip = getStatusChip(provider.status);
      return (
        <article className="provider-card" aria-label={`Provider ${provider.platform}`}>
          <div className="provider-header">
            <div className="provider-avatar" style={{ background: bg, color: fg }} aria-hidden="true">
              {(provider.platform || '?').charAt(0).toUpperCase()}
            </div>
            <div className="provider-info">
              <div className="provider-name">{provider.platform}</div>
              <div className="provider-alias">{provider.account_alias || 'default'}</div>
            </div>
            <span className={`status-chip ${chip}`} role="status" aria-label={`Status ${formatStatusLabel(provider.status)}`}>
              <span className="dot" aria-hidden="true" />
              {formatStatusLabel(provider.status)}
            </span>
          </div>
          <div className="quotas-grid">
            <QuotaBlock label="5H" data={provider.quotas?.['5H']} />
            <QuotaBlock label="1W" data={provider.quotas?.['1W']} />
            <QuotaBlock label="1M" data={provider.quotas?.['1M']} />
          </div>
          <div className="provider-footer">
            <span>Last sync: {timeAgo(provider.last_sync)}</span>
            <span>Version: {provider.version ?? '—'}</span>
          </div>
        </article>
      );
    }

    function SkeletonCard() {
      return <div className="skeleton skeleton-card" aria-hidden="true" />;
    }

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [lastFetch, setLastFetch] = useState(null);
      const [spinning, setSpinning] = useState(false);
      const abortRef = useRef(null);

      const fetchData = useCallback(async (manual = false) => {
        if (manual) setSpinning(true);
        setLoading(true);
        setError(null);
        if (abortRef.current) abortRef.current.abort();
        const ctrl = new AbortController();
        abortRef.current = ctrl;
        try {
          const res = await fetch(API_URL, { signal: ctrl.signal, cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          setData(Array.isArray(json) ? json : []);
          setLastFetch(new Date());
        } catch (e) {
          if (e.name !== 'AbortError') {
            setError(e.message || 'Failed to load data');
          }
        } finally {
          setLoading(false);
          setSpinning(false);
        }
      }, []);

      useEffect(() => {
        fetchData();
        const id = setInterval(() => fetchData(), 30000);
        return () => clearInterval(id);
      }, [fetchData]);

      useEffect(() => {
        const id = setInterval(() => setLastFetch(d => d), 10000); // force re-render for timeAgo
        return () => clearInterval(id);
      }, []);

      return (
        <div className="app-root">
          <header className="app-header">
            <div className="app-header-inner">
              <h1 className="app-header-title">Coding Plans</h1>
              <div className="app-header-meta">
                <span className="last-updated" aria-live="polite">
                  {lastFetch ? `Updated ${timeAgo(lastFetch.toISOString())}` : 'Loading…'}
                </span>
                <button
                  className={`refresh-btn ${spinning ? 'spinning' : ''}`}
                  onClick={() => fetchData(true)}
                  aria-label="Refresh data"
                  title="Refresh"
                >
                  <IconRefresh />
                </button>
              </div>
            </div>
          </header>

          <main className="app-main">
            {error && (
              <div className="state-banner error" role="alert">
                <IconAlert size={22} />
                <div>
                  <div className="state-banner-title">Failed to load data</div>
                  <div className="state-banner-msg">{error}</div>
                </div>
                <button className="retry-btn" onClick={() => fetchData(true)}>Retry</button>
              </div>
            )}

            {loading && !data && (
              <>
                <SkeletonCard />
                <SkeletonCard />
                <SkeletonCard />
              </>
            )}

            {!loading && data && data.length === 0 && (
              <div className="state-banner empty">
                <IconInbox />
                <div className="state-banner-title" style={{ marginTop: 12 }}>No providers</div>
                <div className="state-banner-msg">No usage data available yet.</div>
              </div>
            )}

            {data && data.map(p => <ProviderCard key={`${p.platform}-${p.account_alias}`} provider={p} />)}
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
